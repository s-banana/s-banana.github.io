<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公開テストページ</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .card {
    max-width: 480px;
    padding: 48px 40px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.7;
    color: #555;
    margin: 0 0 8px;
  }
  .meta {
    margin-top: 24px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">公開テスト成功</span>
    <h1>このページが見えていれば公開設定は完了です</h1>
    <p>ここは GitHub Pages の動作確認用プレースホルダーです。</p>
    <p>本番のWebページは別プロジェクトで作成し、このファイルを置き換えて公開します。</p>
    <div class="meta">index.html を差し替えるだけで内容を更新できます</div>
  </div>
</body>
</html>
