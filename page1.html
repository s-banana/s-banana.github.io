<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出産準備チェックリスト</title>
<style>
  :root{
    --bg:#FBF7F2;
    --surface:#FFFFFF;
    --ink:#33303A;
    --ink-soft:#8D8794;
    --ink-faint:#B9B2C0;
    --line:#EFE8E0;

    --high:#FF8F73;
    --high-bg:#FFE9E2;
    --high-deep:#E8724F;

    --mid:#5FB68A;
    --mid-bg:#E4F5EC;
    --mid-deep:#3F9A6E;

    --hosp:#6E93D6;
    --hosp-bg:#E7EEFC;
    --hosp-deep:#4C74BD;

    --gold:#F0B857;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 4px 16px rgba(60,40,30,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 0%, #FFF1EC 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #EAF2FF 0%, transparent 40%),
      var(--bg);
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);
    padding:0 0 70px;
    -webkit-font-smoothing:antialiased;
  }

  header{
    padding:30px 20px 22px;
    position:relative;
  }
  header h1{
    font-size:23px;
    margin:0 0 4px;
    letter-spacing:.01em;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }

  .tally-wrap{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .tally-label{ font-size:13px; color:var(--ink); font-weight:700; }
  #saveNotice{
    font-size:11px;
    font-weight:700;
    color:var(--mid-deep);
    background:var(--mid-bg);
    padding:3px 10px;
    border-radius:999px;
  }
  #saveNotice.is-error{
    color:var(--high-deep);
    background:var(--high-bg);
  }
  .progress-track{
    margin-top:10px;
    width:100%;
    height:12px;
    background:var(--surface);
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--high), var(--gold) 55%, var(--mid));
    border-radius:999px;
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }

  .save-row{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .save-btn{
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, var(--mid), var(--mid-deep));
    border:none;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .save-btn:active{ transform:scale(.96); }
  .save-status{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:18px 20px 0;
    padding:5px;
    background:var(--surface);
    border-radius:999px;
    box-shadow:var(--shadow);
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1 0 auto;
    white-space:nowrap;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    background:none;
    border:none;
    padding:9px 14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:999px;
    transition:background .2s ease, color .2s ease;
  }
  nav.tabs button.active{
    color:#fff;
    background:linear-gradient(135deg, var(--high), var(--high-deep));
  }

  main{padding:18px 16px 0;}
  section.panel{display:none;}
  section.panel.active{display:block;}

  .priority-title{
    font-size:16px;
    margin:6px 4px 14px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .priority-title .dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;
  }

  .category{
    margin-bottom:16px;
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .category .cat-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
  }
  .cat-icon{
    width:32px; height:32px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    flex-shrink:0;
  }
  .category .cat-head h2{
    font-size:14px;
    margin:0;
    font-weight:800;
    flex:1;
  }
  .cat-progress{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--bg);
    padding:3px 9px;
    border-radius:999px;
    flex-shrink:0;
  }

  table{ width:100%; border-collapse:collapse; }
  tr{ border-top:1px solid var(--line); }
  tr:first-child{ border-top:none; }
  td{ padding:10px 12px; font-size:13.5px; vertical-align:middle; }
  td.check-col{width:38px; text-align:center;}
  td.note-col{ text-align:right; }

  .note-tag{
    display:inline-block;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
  }
  .note-input{
    font-family:inherit;
    font-size:11px;
    color:var(--ink);
    border:none;
    border-bottom:2px solid var(--high);
    background:transparent;
    padding:0 0 2px;
    width:90px;
    text-align:right;
    box-sizing:border-box;
  }
  .note-input:focus{ outline:none; }
  .purchased-tag{
    display:block;
    font-size:10.5px;
    color:var(--mid-deep);
    background:var(--mid-bg);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    margin-top:4px;
  }

  .buy-btn{
    border:none; background:var(--bg); cursor:pointer;
    font-size:11px; color:var(--ink-soft);
    margin-left:6px; padding:2px 6px;
    border-radius:999px;
    vertical-align:middle;
  }
  .buy-btn.has-buy{ color:var(--mid-deep); background:var(--mid-bg); }

  tr.buy-row td{ padding:0 14px 14px; border-top:none; }
  tr.buy-row.hidden{ display:none; }
  .buy-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .buy-form input{
    font-family:inherit;
    font-size:12.5px;
    padding:8px 10px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--bg);
    box-sizing:border-box;
  }
  .buy-form input.buy-store-input{ flex:1.2; min-width:120px; }
  .buy-form input.buy-price-input{ flex:1; min-width:90px; }
  .buy-form input.buy-buyer-input{ flex-basis:100%; }
  .buy-form input:focus{ outline:none; border-color:var(--mid); }

  .breakdown-row{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .breakdown-chip{
    font-size:11px;
    color:var(--mid-deep);
    background:var(--mid-bg);
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  .total-row{
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    padding:10px 14px;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
  }
  .total-label{ font-size:12px; color:var(--ink-soft); font-weight:700; }
  .total-value{ font-size:17px; color:var(--mid-deep); font-weight:800; }

  .checkbox{
    width:22px;height:22px;
    border:2px solid var(--ink-faint);
    border-radius:50%;
    display:inline-block;
    cursor:pointer;
    position:relative;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .checkbox:active{ transform:scale(.9); }
  .checkbox.checked{ border-color:transparent; }
  .checkbox.checked::after{
    content:"";
    position:absolute;
    left:6px; top:2px;
    width:6px; height:11px;
    border:solid #fff;
    border-width:0 2.5px 2.5px 0;
    transform:rotate(40deg);
  }

  .item-text{ cursor:pointer; font-weight:600; }
  .item-text.checked{ color:var(--ink-faint); text-decoration:line-through; font-weight:400; }

  .memo-btn{
    border:none; background:var(--bg); cursor:pointer;
    font-size:11px; color:var(--ink-soft);
    margin-left:6px; padding:2px 6px;
    border-radius:999px;
    vertical-align:middle;
  }
  .memo-btn.has-memo{ color:var(--high-deep); background:var(--high-bg); }

  .rename-input{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    border:none;
    border-bottom:2px solid var(--high);
    background:transparent;
    padding:0 0 2px;
    width:100%;
    box-sizing:border-box;
  }
  .rename-input:focus{ outline:none; }

  .del-btn{
    border:none; background:none; cursor:pointer;
    font-size:14px; color:var(--ink-faint);
    margin-left:4px; padding:0 4px;
    vertical-align:middle;
  }

  .add-item-row td{ padding:10px 12px; }
  .add-item-form{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .add-item-input{
    flex:1;
    font-family:inherit;
    font-size:13px;
    padding:8px 12px;
    border:1.5px dashed var(--line);
    border-radius:var(--radius-sm);
    background:var(--bg);
    box-sizing:border-box;
  }
  .add-item-input:focus{ outline:none; border-color:var(--high); border-style:solid; }
  .add-item-btn{
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, var(--high), var(--high-deep));
    border:none;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }

  tr.memo-row td{ padding:0 14px 14px; border-top:none; }
  tr.memo-row.hidden{ display:none; }
  textarea.memo-input{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:8px 10px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--bg);
    resize:vertical;
    min-height:36px;
    box-sizing:border-box;
  }
  textarea.memo-input:focus{ outline:none; border-color:var(--high); }

  footer{ padding:22px 20px 0; font-size:11px; color:var(--ink-soft); line-height:1.6; }

  .price-note{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 14px;
    line-height:1.6;
    background:var(--surface);
    padding:12px 14px;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
  }
  table.price-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 8px;
  }
  table.price-table th{
    text-align:left;
    font-size:10.5px;
    color:var(--ink-soft);
    padding:0 10px 4px;
    font-weight:800;
  }
  table.price-table tr:not(:first-child){
    background:var(--surface);
    box-shadow:var(--shadow);
  }
  table.price-table td{
    font-size:12.5px;
    padding:12px 10px;
    vertical-align:top;
  }
  table.price-table tr:not(:first-child) td:first-child{ border-radius:var(--radius-sm) 0 0 var(--radius-sm); }
  table.price-table tr:not(:first-child) td:last-child{ border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
  table.price-table td.item-name{ font-weight:800; width:26%; }
  table.price-table td.cheapest{ color:var(--mid-deep); font-weight:800; }
</style>
</head>
<body>

<header>
  <h1>👶 出産準備チェックリスト</h1>
  <p class="sub">出産準備の進捗管理</p>
  <div class="tally-wrap">
    <span class="tally-label" id="tallyLabel">進捗 0 / 0</span>
    <span id="saveNotice" style="opacity:0;transition:opacity .3s;"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="total-row">
    <span class="total-label">💰 購入済み合計</span>
    <span class="total-value" id="totalValue">¥0</span>
  </div>
  <div class="breakdown-row" id="breakdownRow"></div>
  <div class="save-row">
    <button type="button" class="save-btn" id="manualSaveBtn">💾 今すぐ保存して確認</button>
    <button type="button" class="save-btn" id="tokenSetupBtn" style="background:linear-gradient(135deg, var(--hosp), var(--hosp-deep));">🔑 GitHubトークン設定</button>
    <span class="save-status" id="saveStatus"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-panel="p-high">必須</button>
  <button class="tab-btn" data-panel="p-mid">あると便利</button>
  <button class="tab-btn" data-panel="p-hosp">入院バッグ</button>
  <button class="tab-btn" data-panel="p-price">価格比較</button>
</nav>

<main>
  <section class="panel active" id="p-high"></section>
  <section class="panel" id="p-mid"></section>
  <section class="panel" id="p-hosp"></section>

</main>

<footer>タップでチェックのオン/オフ、✏️で名前変更、💬でメモ、💰で購入店舗・金額を記録できます。購入予定の店舗（右側のタグ）もタップで編集できます。内容はGitHubリポジトリ（s-banana/s-banana.github.io）に保存されます。初めて使う端末では🔑ボタンからGitHub Personal Access Tokenを入力してください（そのブラウザにだけ保存され、コードには含まれません）。</footer>

function addMemoField(dataObj){
  var keys = Object.keys(dataObj);

var GITHUB_OWNER = "s-banana";
var GITHUB_REPO = "s-banana.github.io";
var GITHUB_BRANCH = "main";
var GITHUB_DATA_PATH = "baby-checklist-data.json";
var GITHUB_TOKEN_KEY = "baby-checklist-gh-token"; // localStorage key, browser-only, never committed

function getGithubToken(){
  try { return localStorage.getItem(GITHUB_TOKEN_KEY) || ""; }
  catch (err) { return ""; }
}

function setupGithubToken(){
  var current = getGithubToken();
  var entered = window.prompt(
    "GitHub Personal Access Token を入力してください。\n" +
    "このブラウザだけに保存され、コードやリポジトリには一切含まれません。\n" +
    "空にして OK を押すとトークンを削除します。",
    current
  );
  if (entered === null) return; // cancelled
  try {
    if (entered.trim()) {
      localStorage.setItem(GITHUB_TOKEN_KEY, entered.trim());
      showSaveNotice("トークンを保存しました");
    } else {
      localStorage.removeItem(GITHUB_TOKEN_KEY);
      showSaveNotice("トークンを削除しました");
    }
  } catch (err) {
    showSaveNotice("トークンの保存に失敗しました", true);
  }
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
}

async function ghGetFile(){
  var token = getGithubToken();
  var url = "https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO +
    "/contents/" + GITHUB_DATA_PATH + "?ref=" + GITHUB_BRANCH;
  var headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "token " + token;
  var res = await fetch(url, { headers: headers });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("GitHub取得エラー: " + res.status);
  var data = await res.json();
  return { sha: data.sha, content: base64ToUtf8(data.content) };
}

async function ghPutFile(contentStr, sha){
  var token = getGithubToken();
  if (!token) throw new Error("GitHubトークンが未設定です");
  var url = "https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO +
    "/contents/" + GITHUB_DATA_PATH;
  var body = {
    message: "update checklist data",
    content: utf8ToBase64(contentStr),
    branch: GITHUB_BRANCH
  };
  if (sha) body.sha = sha;
  var res = await fetch(url, {
    method: "PUT",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "token " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    var errText = "";
    try { errText = (await res.json()).message; } catch (e) {}
    throw new Error("GitHub保存エラー " + res.status + (errText ? ": " + errText : ""));
  }
  return await res.json();
}

function updateTotal(){

  var keys = Object.keys(DATA);

      for (var ii = 0; ii < cats[ci].items.length; ii++){

        var p = Number(item.price);
        if (!isNaN(p) && p > 0) {
          total += p;
          var buyerName = (item.buyer || "").trim();
          if (buyerName) {
            byBuyer[buyerName] = (byBuyer[buyerName] || 0) + p;
          } else {

  var el = document.getElementById("totalValue");
  if (el) el.textContent = "¥" + total.toLocaleString("ja-JP");

  var breakdownEl = document.getElementById("breakdownRow");
  if (breakdownEl) {

      chip.className = "breakdown-chip";

function collectState(){
  var done = {};
  var memo = {};
  var names = {};
  var notes = {};
  var buyStore = {};
  var price = {};
  var buyer = {};
  var customItems = {};
  var keys = Object.keys(DATA);
  for (var k = 0; k < keys.length; k++){
    var cats = DATA[keys[k]].cats;
    for (var ci = 0; ci < cats.length; ci++){
      var customTexts = [];
      for (var ii = 0; ii < cats[ci].items.length; ii++){
        var it = cats[ci].items[ii];
        var id = keys[k] + "-" + ci + "-" + ii;
        if (it.done) done[id] = true;
        if (it.memo) memo[id] = it.memo;
        if (it.buyStore) buyStore[id] = it.buyStore;
        if (it.price !== "" && it.price !== null && typeof it.price !== "undefined") price[id] = it.price;
        if (it.buyer) buyer[id] = it.buyer;
        if (it.isCustom) {
          customTexts.push({ t: it.t, n: it.n });
        } else {
          var defaultText = DEFAULT_TEXT[id];
          if (defaultText !== undefined && it.t !== defaultText) names[id] = it.t;
          var defaultNote = DEFAULT_NOTE[id];
          if (defaultNote !== undefined && it.n !== defaultNote) notes[id] = it.n;
        }
      }
      if (customTexts.length) customItems[keys[k] + "-" + ci] = customTexts;
    }
  }
  return { done: done, memo: memo, names: names, notes: notes, buyStore: buyStore, price: price, buyer: buyer, customItems: customItems };
}

function applyState(state){
  var done = (state && state.done) ? state.done : {};
  var memo = (state && state.memo) ? state.memo : {};
  var names = (state && state.names) ? state.names : {};
  var notes = (state && state.notes) ? state.notes : {};
  var buyStoreMap = (state && state.buyStore) ? state.buyStore : {};
  var priceMap = (state && state.price) ? state.price : {};
  var buyerMap = (state && state.buyer) ? state.buyer : {};
  var customItems = (state && state.customItems) ? state.customItems : {};

  // First, re-add any custom items in their saved order so indices line up.
  var catKeys = Object.keys(customItems);
  for (var c = 0; c < catKeys.length; c++){
    var parts = catKeys[c].split("-");
    var gk = parts[0];
    var ci = parseInt(parts[1], 10);
    if (!DATA[gk] || !DATA[gk].cats[ci]) continue;
    var entries = customItems[catKeys[c]];
    for (var t2 = 0; t2 < entries.length; t2++){
      var entry = entries[t2];
      var entryText = (typeof entry === "string") ? entry : entry.t;
      var entryNote = (typeof entry === "string") ? "" : (entry.n || "");
      DATA[gk].cats[ci].items.push({ t: entryText, n: entryNote, done: false, memo: "", isCustom: true, buyStore: "", price: "", buyer: "" });
    }
  }

  var keys = Object.keys(DATA);
  for (var k = 0; k < keys.length; k++){
    var cats = DATA[keys[k]].cats;
    for (var ci2 = 0; ci2 < cats.length; ci2++){
      for (var ii = 0; ii < cats[ci2].items.length; ii++){
        var id = keys[k] + "-" + ci2 + "-" + ii;
        var item = cats[ci2].items[ii];
        item.done = !!done[id];
        item.memo = memo[id] || "";
        item.buyStore = buyStoreMap[id] || "";
        item.price = (typeof priceMap[id] !== "undefined") ? priceMap[id] : "";
        item.buyer = buyerMap[id] || "";
        if (!item.isCustom && names[id]) {
          item.t = names[id];
        }
        if (!item.isCustom && notes[id] !== undefined) {
          item.n = notes[id];
        }
      }
    }
  }
}

var saveInFlight = null;

async function saveState(){
  if (!getGithubToken()) {
    showSaveNotice("GitHubトークンが未設定です（🔑ボタンから設定）", true);
    return;
  }
  try {
    var current = await ghGetFile();
    var payload = JSON.stringify(collectState(), null, 2);
    await ghPutFile(payload, current ? current.sha : null);
    showSaveNotice("保存しました（GitHubにコミット）");
  } catch (err) {
    showSaveNotice("保存エラー: " + (err && err.message ? err.message : String(err)), true);
  }
}

async function loadState(){
  try {
    var rawUrl = "https://raw.githubusercontent.com/" + GITHUB_OWNER + "/" + GITHUB_REPO +
      "/" + GITHUB_BRANCH + "/" + GITHUB_DATA_PATH + "?t=" + Date.now();
    var res = await fetch(rawUrl, { cache: "no-store" });
    if (res.ok) {
      var text = await res.text();
      var state = JSON.parse(text);
      applyState(state);
    }
  } catch (err) {
    // First-ever load / file not created yet — start fresh, no need to surface this.
  }
}

function showSaveNotice(msg, isError){
  var el = document.getElementById("saveNotice");
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle("is-error", !!isError);
  el.style.opacity = "1";
  setTimeout(function(){ el.style.opacity = "0"; }, 1800);
}

function updateTally(){
  var total = 0, done = 0;
  var keys = Object.keys(DATA);
  for (var k = 0; k < keys.length; k++){
    var cats = DATA[keys[k]].cats;
    for (var ci = 0; ci < cats.length; ci++){
      for (var ii = 0; ii < cats[ci].items.length; ii++){
        total++;
        if (cats[ci].items[ii].done) done++;
      }
    }
  }
  var pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("tallyLabel").textContent = "進捗 " + done + " / " + total + "（" + pct + "%）";
  document.getElementById("progressFill").style.width = pct + "%";
}

async function verifySave(){
  var statusEl = document.getElementById("saveStatus");
  if (!statusEl) return;

  if (!getGithubToken()) {
    statusEl.textContent = "❌ GitHubトークンが未設定です（🔑ボタンから設定してください）";
    return;
  }

  statusEl.textContent = "保存中…";

  var payload = JSON.stringify(collectState(), null, 2);

  var current;
  try {
    current = await ghGetFile();
  } catch (err) {
    statusEl.textContent = "❌ 取得エラー: " + (err && err.message ? err.message : String(err));
    return;
  }

  try {
    await ghPutFile(payload, current ? current.sha : null);
  } catch (err) {
    statusEl.textContent = "❌ 保存エラー: " + (err && err.message ? err.message : String(err));
    return;
  }

  try {
    var verify = await ghGetFile();
    if (verify && verify.content === payload) {
      statusEl.textContent = "✅ 保存OK・読み直しも一致しました（" + new Date().toLocaleTimeString("ja-JP") + "）";
    } else if (verify) {
      statusEl.textContent = "⚠️ 保存はできましたが、読み直した内容が一致しません";
    } else {
      statusEl.textContent = "⚠️ 保存はできましたが、読み直しで結果が空でした";
    }
  } catch (err) {
    statusEl.textContent = "⚠️ 保存はできましたが、読み直しでエラー: " + (err && err.message ? err.message : String(err));
  }
}

async function init(){
  document.addEventListener("click", function(e){
    var t = e.target;
    if (t.className && (t.className.indexOf("checkbox") !== -1 || t.className.indexOf("item-text") !== -1)) {
      var key = t.getAttribute("data-key");
      var ci = parseInt(t.getAttribute("data-ci"), 10);
      var ii = parseInt(t.getAttribute("data-ii"), 10);
      toggle(key, ci, ii);
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-memo-toggle")) {
      var rowId = t.getAttribute("data-memo-toggle");
      var memoRow = document.querySelector('[data-memo-row="' + rowId + '"]');
      if (memoRow) {
        memoRow.classList.toggle("hidden");
        if (!memoRow.classList.contains("hidden")) {
          var ta = memoRow.querySelector("textarea");
          if (ta) ta.focus();
        }
      }
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-note-toggle")) {
      var noteId = t.getAttribute("data-note-toggle");
      var noteParts = noteId.split("-");
      toggleNoteEdit(noteParts[0], parseInt(noteParts[1], 10), parseInt(noteParts[2], 10));
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-buy-toggle")) {
      var buyId = t.getAttribute("data-buy-toggle");
      var buyRow = document.querySelector('[data-buy-row="' + buyId + '"]');
      if (buyRow) {
        buyRow.classList.toggle("hidden");
        if (!buyRow.classList.contains("hidden")) {
          var bi = buyRow.querySelector(".buy-store-input");
          if (bi) bi.focus();
        }
      }
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-rename-toggle")) {
      var rnId = t.getAttribute("data-rename-toggle");
      var rnParts = rnId.split("-");
      toggleRenameEdit(rnParts[0], parseInt(rnParts[1], 10), parseInt(rnParts[2], 10));
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-del-key")) {
      var dKey = t.getAttribute("data-del-key");
      var dCi = parseInt(t.getAttribute("data-del-ci"), 10);
      var dIi = parseInt(t.getAttribute("data-del-ii"), 10);
      deleteItem(dKey, dCi, dIi);
      return;
    }
    if (t.className && t.className.indexOf("add-item-btn") !== -1) {
      var aKey = t.getAttribute("data-add-key");
      var aCi = parseInt(t.getAttribute("data-add-ci"), 10);
      var inputEl = t.parentElement.querySelector(".add-item-input");
      if (inputEl) {
        addItem(aKey, aCi, inputEl.value);
        inputEl.value = "";
      }
      return;
    }
    if (t.id === "manualSaveBtn") {
      verifySave();
      return;
    }
    if (t.id === "tokenSetupBtn") {
      setupGithubToken();
      return;
    }
    if (t.className && t.className.indexOf("tab-btn") !== -1) {
      var btns = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
      var panels = document.querySelectorAll(".panel");
      for (var j = 0; j < panels.length; j++) panels[j].classList.remove("active");
      t.classList.add("active");
      document.getElementById(t.getAttribute("data-panel")).classList.add("active");
    }
  });

  document.addEventListener("focusout", function(e){
    var t = e.target;
    if (t.tagName === "TEXTAREA" && t.className.indexOf("memo-input") !== -1) {
      var key = t.getAttribute("data-key");
      var ci = parseInt(t.getAttribute("data-ci"), 10);
      var ii = parseInt(t.getAttribute("data-ii"), 10);
      updateMemo(key, ci, ii, t.value);
    }
    if (t.tagName === "INPUT" && t.className.indexOf("rename-input") !== -1) {
      var rKey = t.getAttribute("data-key");
      var rCi = parseInt(t.getAttribute("data-ci"), 10);
      var rIi = parseInt(t.getAttribute("data-ii"), 10);
      commitRename(rKey, rCi, rIi, t.value);
    }
    if (t.tagName === "INPUT" && t.className.indexOf("note-input") !== -1) {
      var nKey = t.getAttribute("data-key");
      var nCi = parseInt(t.getAttribute("data-ci"), 10);
      var nIi = parseInt(t.getAttribute("data-ii"), 10);
      commitNote(nKey, nCi, nIi, t.value);
    }
    if (t.tagName === "INPUT" && t.className.indexOf("buy-store-input") !== -1) {
      var bsKey = t.getAttribute("data-key");
      var bsCi = parseInt(t.getAttribute("data-ci"), 10);
      var bsIi = parseInt(t.getAttribute("data-ii"), 10);
      updateBuyStore(bsKey, bsCi, bsIi, t.value);
    }
    if (t.tagName === "INPUT" && t.className.indexOf("buy-price-input") !== -1) {
      var bpKey = t.getAttribute("data-key");
      var bpCi = parseInt(t.getAttribute("data-ci"), 10);
      var bpIi = parseInt(t.getAttribute("data-ii"), 10);
      updateBuyPrice(bpKey, bpCi, bpIi, t.value);
    }
    if (t.tagName === "INPUT" && t.className.indexOf("buy-buyer-input") !== -1) {
      var buKey = t.getAttribute("data-key");
      var buCi = parseInt(t.getAttribute("data-ci"), 10);
      var buIi = parseInt(t.getAttribute("data-ii"), 10);
      updateBuyer(buKey, buCi, buIi, t.value);
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    var t = e.target;
    if (t.tagName === "INPUT" && t.className.indexOf("rename-input") !== -1) {
      e.preventDefault();
      t.blur();
    }
    if (t.tagName === "INPUT" && t.className.indexOf("note-input") !== -1) {
      e.preventDefault();
      t.blur();
    }
    if (t.tagName === "INPUT" && t.className.indexOf("add-item-input") !== -1) {
      e.preventDefault();
      var aKey = t.getAttribute("data-add-key");
      var aCi = parseInt(t.getAttribute("data-add-ci"), 10);
      addItem(aKey, aCi, t.value);
      t.value = "";
    }
  });

  try {
    render();
  } catch (err) {
    // Rendering failure — fail silently rather than surfacing a console warning to the user
  }
  try {
    await loadState();
    render();
  } catch (err) {
    // Loading saved state failed — page still works with defaults
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
